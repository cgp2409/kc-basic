# Genera y publica todas las invitaciones (demos + clientes) en basic.kcdigitalmagic.com.
# Se ejecuta cuando la hoja de pedidos sube un evento, a diario (retira las vencidas) o a mano.
name: Publicar invitaciones
on:
  push:
    branches: [main]
  schedule:
    - cron: "7 11 * * *"   # 6:07 a. m. hora Colombia
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Plantillas (repositorio público)
        uses: actions/checkout@v4
        with:
          repository: cgp2409/kc-basic
          path: kc
      - name: Eventos de clientes (este repositorio)
        uses: actions/checkout@v4
        with:
          path: privado
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kc/requirements.txt
      - run: pip install -r kc/requirements.txt
      - name: Generar
        run: python kc/scripts/publicar_ci.py privado resultado.json
      - name: Resultado para la hoja
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado
          path: resultado.json
          retention-days: 3
          if-no-files-found: ignore
      - name: Subir a la rama publicado
        env:
          TOKEN: ${{ secrets.KC_PUBLICAR_TOKEN }}
        run: |
          cd kc/dist
          git init -q -b publicado
          git add -A
          git -c user.name="KC Basic" -c user.email="noreply@kcdigitalmagic.com" commit -qm "Publicación automática"
          git push -fq "https://x-access-token:${TOKEN}@github.com/cgp2409/kc-basic.git" HEAD:publicado
      - name: ¿Hubo errores?
        run: python -c "import json,sys; sys.exit(0 if json.load(open('resultado.json'))['ok'] else 1)"
