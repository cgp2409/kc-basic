</div></header>
<script>
(function(){
  var sel=document.getElementById("kc-pais"); if(!sel) return;
  function guardado(){ try{return localStorage.getItem("kc-pais-tienda");}catch(e){return null;} }
  function guardar(v){ try{localStorage.setItem("kc-pais-tienda",v);}catch(e){} }
  function adivinar(){
    var tz=""; try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"";}catch(e){}
    if(tz==="America/Bogota") return "CO";
    if(/^America\/(Mexico_City|Cancun|Merida|Monterrey|Matamoros|Chihuahua|Ojinaga|Mazatlan|Bahia_Banderas|Hermosillo|Tijuana)$/.test(tz)) return "MX";
    return "US";
  }
  function enviar(v){
    guardar(v);
    var f=document.createElement("form"); f.method="post"; f.action=location.href;
    f.innerHTML='<input type="hidden" name="wcpbc-manual-country" value="'+v+'">';
    document.body.appendChild(f); f.submit();
  }
  var g=guardado();
  sel.value = g || adivinar();
  sel.addEventListener("change",function(){ enviar(sel.value); });
  // Primera visita a la tienda: aplica el país adivinado una sola vez
  var tienda=/single-product|woocommerce-cart|woocommerce-checkout|post-type-archive-product/.test(document.body.className);
  if(!g && tienda) enviar(sel.value);
})();
</script>
